# ============================================================
# application.properties — ISO-20022 Payment Processing System
# ============================================================

spring.application.name=iso20022-payment-system
server.port=8080
server.servlet.context-path=/

# ==================== Active Profile ====================
spring.profiles.active=dev

# ==================== H2 In-Memory Database (Dev) ====================
spring.datasource.url=jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==================== JPA / Hibernate ====================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ==================== Jackson ====================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC

# ==================== Actuator ====================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ==================== Logging ====================
logging.level.com.fintech.payment=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n

# ==================== JWT Security ====================
app.jwt.secret=ISO20022PaymentSystemSecretKey2024@FinTechPlatform#Secure
app.jwt.expiration-ms=86400000

# ==================== Payment Processing ====================
app.payment.settlement.delay-ms=500
app.payment.max-amount=1000000.00
app.payment.supported-currencies=USD,EUR,GBP,JPY,CHF,AUD,CAD

# ==================== OpenAPI / Swagger ====================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
